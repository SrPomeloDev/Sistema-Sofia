<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Rutas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #C41E24;
            --primary-hover: #A01820;
            --primary-light: #FEF2F2;
            --bg-base: #F8F9FA;
            --bg-surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border-light: #E5E7EB;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-float: 0 10px 30px rgba(196,30,36,0.15);
            --font-title: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 380px;
            width: 90%;
            box-shadow: var(--shadow-float);
        }
        .login-logo {
            width: 64px; height: 64px;
            background: var(--primary-light);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }
        h1 {
            font-family: var(--font-title);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        .sub { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; }
        input {
            width: 100%; padding: 0.75rem 1rem;
            border: 1px solid var(--border-light); border-radius: var(--radius-md);
            font-family: inherit; font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); }
        .btn {
            width: 100%; padding: 0.8rem; border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-title); font-weight: 700; font-size: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:disabled { opacity: 0.6; }
        #errorMsg { color: var(--primary); font-size: 0.85rem; text-align: center; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo"><i data-lucide="map" style="width:28px;height:28px;color:var(--primary);"></i></div>
        <h1>Rutas y Tarifas</h1>
        <p class="sub">Inicia sesión para gestionar las rutas</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Código de empleado" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="loginBtn">Ingresar</button>
        </form>
        <div id="errorMsg"></div>
    </div>
    <script>
        (async () => {
            const token = localStorage.getItem('auth_token');
            if (token) {
                try {
                    const r = await fetch('/api/check-auth?token=' + encodeURIComponent(token));
                    const d = await r.json();
                    if (d.success) { window.location.href = '/rutas'; return; }
                } catch(e) {}
            }
        })();
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errorMsg');
            btn.disabled = true; btn.textContent = 'Ingresando...';
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const d = await r.json();
                if (d.success) {
                    localStorage.setItem('auth_token', d.token);
                    localStorage.setItem('auth_user', d.username);
                    localStorage.setItem('auth_display_name', d.display_name);
                    window.location.href = '/rutas';
                } else {
                    err.textContent = d.message || 'Credenciales inválidas';
                }
            } catch(e) {
                err.textContent = 'Error de conexión';
            }
            btn.disabled = false; btn.textContent = 'Ingresar';
        });
    </script>
</body>
</html>
